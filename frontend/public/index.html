<!DOCTYPE html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A111D" />
    <meta name="description" content="CyberGuard: AI-powered cyber threat, phishing and digital impersonation detection platform" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230A111D'/%3E%3Cpath d='M20 6.5 31 10.7v7.9c0 6.9-4.7 12.2-11 14.5-6.3-2.3-11-7.6-11-14.5v-7.9z' fill='none' stroke='%233AA6E8' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='m15.2 19.8 3.5 3.5 6.4-6.8' fill='none' stroke='%233AA6E8' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>CyberGuard | AI Threat Detection & Response</title>
    <script>
      /* Apply the saved theme before the first paint (no flash of the wrong theme). */
      try { var t = localStorage.getItem('cg_theme'); if (t === 'midnight' || t === 'daylight' || t === 'graphite') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>

    <noscript>You need to enable JavaScript to run CyberGuard.</noscript>
    <div id="root"></div>
  </body>
</html>
